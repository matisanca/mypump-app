# Versiones de todo el proyecto Android nativo. AGP va en la misma línea que la app Capacitor (android/, 8.13) para
# no tener dos toolchains distintas en la misma máquina.
[versions]
agp = "8.13.2"
kotlin = "2.4.20"
kotlinx-serialization = "1.11.0"
kotlinx-coroutines = "1.11.0"
# 5.5.0 (okhttp-android) pide compileSdk 37; 5.4.0 es la última con 36, la de esta etapa (ver compose-bom).
okhttp = "5.4.0"
# El último BOM con Compose 1.11: desde 2026.08.00 (Compose 1.12) piden compileSdk 37 y AGP 9.1.
compose-bom = "2026.06.01"
activity-compose = "1.11.0"
# 2.11.0 pide compileSdk 37 y AGP 9.1, como Compose 1.12.
lifecycle = "2.10.0"
junit-jupiter = "5.14.4"
androidx-test-runner = "1.7.0"
androidx-test-junit = "1.3.0"
# Custom Tabs: las fuentes y las páginas legales dentro de la app, como el SFSafariViewController de iOS.
androidx-browser = "1.10.0"
# Avisos (FCM) con el mismo proyecto de Firebase de la app vieja (mypump-663be): las versiones que ya compila la
# Capacitor en esta Mac y están en la caché de Gradle (G4, OK de Mati del 14-oct). Nada más de Firebase.
google-services = "4.4.4"
firebase-messaging = "25.0.1"
# Salud: Health Connect, la MISMA versión que compila hoy la Capacitor por el plugin @capgo/capacitor-health 8.9.3 (OK de
# Mati, G4 del 14-oct). Una más nueva podría contestar distinto que lo que ve la app de hoy.
health-connect = "1.1.0"

[libraries]
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinx-serialization" }
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "kotlinx-coroutines" }
kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "kotlinx-coroutines" }
okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }
compose-bom = { module = "androidx.compose:compose-bom", version.ref = "compose-bom" }
compose-material3 = { module = "androidx.compose.material3:material3" }
compose-ui = { module = "androidx.compose.ui:ui" }
compose-ui-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview" }
compose-ui-tooling = { module = "androidx.compose.ui:ui-tooling" }
compose-ui-test-junit4 = { module = "androidx.compose.ui:ui-test-junit4" }
compose-ui-test-manifest = { module = "androidx.compose.ui:ui-test-manifest" }
androidx-browser = { module = "androidx.browser:browser", version.ref = "androidx-browser" }
activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activity-compose" }
lifecycle-viewmodel-compose = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "lifecycle" }
lifecycle-runtime-compose = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "lifecycle" }
junit-bom = { module = "org.junit:junit-bom", version.ref = "junit-jupiter" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }
androidx-test-runner = { module = "androidx.test:runner", version.ref = "androidx-test-runner" }
androidx-test-junit = { module = "androidx.test.ext:junit", version.ref = "androidx-test-junit" }
# Avisos: el push de los mensajes de Mati (ver la versión arriba).
firebase-messaging = { module = "com.google.firebase:firebase-messaging", version.ref = "firebase-messaging" }
# Salud: Health Connect (solo lectura).
health-connect-client = { module = "androidx.health.connect:connect-client", version.ref = "health-connect" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
# Avisos: lee app/google-services.json (el de la Capacitor, público) y deja la configuración de Firebase en recursos.
google-services = { id = "com.google.gms.google-services", version.ref = "google-services" }
