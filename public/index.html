  <style>
    /* Layout de landing — no va en components.css porque es específico de esta página */
    body {
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
    }

    .landing-header {
      padding: var(--space-4) var(--space-5);
      display: flex;
      justify-content: flex-end;
      align-items: center;
    }

    .theme-toggle {
      width: 36px;
      height: 36px;
      border-radius: var(--radius-md);
      border: 1px solid var(--color-border);
      background: var(--color-bg-secondary);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--color-text-secondary);
      transition:
        background var(--transition-fast),
        border-color var(--transition-fast),
        color var(--transition-fast);
    }

    .theme-toggle:hover {
      background: var(--color-bg-tertiary);
      color: var(--color-text-primary);
    }

    .theme-toggle svg {
      width: 16px;
      height: 16px;
      flex-shrink: 0;
    }

    /* Muestra sol en dark, luna en light */
    .icon-sun  { display: none; }
    .icon-moon { display: block; }
    [data-theme="dark"] .icon-sun  { display: block; }
    [data-theme="dark"] .icon-moon { display: none; }

    /* Zona central */
    .landing-main {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: var(--space-8) var(--space-5);
      text-align: center;
    }

    /* Logo placeholder — reemplazar con SVG real del logo de Pump Team */
    .logo-wrap {
      width: 72px;
      height: 72px;
      border-radius: var(--radius-lg);
      background: var(--color-brand);
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: var(--space-6);
      box-shadow: var(--shadow-md);
    }

    .logo-wrap svg {
      width: 40px;
      height: 40px;
      color: var(--color-on-brand);
    }

    .landing-title {
      font-size: var(--font-size-3xl);
      font-weight: var(--font-weight-bold);
      letter-spacing: -0.025em;
      color: var(--color-text-primary);
      margin-bottom: var(--space-2);
    }

    .landing-subtitle {
      font-size: var(--font-size-lg);
      font-weight: var(--font-weight-medium);
      color: var(--color-text-secondary);
      margin-bottom: var(--space-3);
    }

    .landing-body {
      font-size: var(--font-size-base);
      color: var(--color-text-muted);
      max-width: 280px;
      line-height: var(--line-height-relaxed);
      margin-bottom: var(--space-8);
    }

    /* Botón secundario (outlined) */
    .btn-secondary {
      display: inline-flex;
      align-items: center;
      gap: var(--space-2);
      padding: var(--space-3) var(--space-5);
      border: 1px solid var(--color-border-strong);
      border-radius: var(--radius-md);
      background: var(--color-bg-secondary);
      color: var(--color-text-primary);
      font-family: var(--font-sans);
      font-size: var(--font-size-sm);
      font-weight: var(--font-weight-medium);
      text-decoration: none;
      cursor: pointer;
      transition:
        background var(--transition-fast),
        border-color var(--transition-fast);
    }

    .btn-secondary:hover {
      background: var(--color-bg-tertiary);
      border-color: var(--color-text-muted);
      opacity: 1;
    }

    .btn-secondary svg {
      width: 14px;
      height: 14px;
      flex-shrink: 0;
    }

    /* Botón primario (filled) — CTA "Ver demo" */
    .btn-primary {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: var(--space-2);
      padding: var(--space-3) var(--space-6);
      border: 0;
      border-radius: var(--radius-md);
      background: var(--color-brand);
      color: var(--color-on-brand);
      font-family: var(--font-sans);
      font-size: var(--font-size-base);
      font-weight: var(--font-weight-semibold);
      text-decoration: none;
      cursor: pointer;
      margin-bottom: var(--space-3);
      transition: opacity var(--transition-fast), transform var(--transition-fast);
    }

    .btn-primary:hover { opacity: 0.92; }
    .btn-primary:active { transform: scale(0.98); }

    .landing-footer {
      padding: var(--space-5);
      text-align: center;
      font-size: var(--font-size-xs);
      color: var(--color-text-muted);
    }

    /* Caja de acceso: la única puerta de entrada para quien bajó la app del
       App Store. Sin esto la landing es un callejón sin salida — el link del
       coach vive en WhatsApp y no hay dónde ponerlo. */
    .access-box {
      width: 100%;
      max-width: 320px;
      margin-top: var(--space-8);
      padding-top: var(--space-6);
      border-top: 1px solid var(--color-border);
      text-align: left;
    }

    .access-label {
      display: block;
      font-size: var(--font-size-sm);
      font-weight: var(--font-weight-medium);
      color: var(--color-text-secondary);
      margin-bottom: var(--space-2);
    }

    .access-input {
      width: 100%;
      padding: var(--space-3);
      border: 1px solid var(--color-border-strong);
      border-radius: var(--radius-md);
      background: var(--color-bg-secondary);
      color: var(--color-text-primary);
      font-family: var(--font-sans);
      font-size: var(--font-size-base); /* 16px o iOS hace zoom al enfocar */
    }

    .access-input::placeholder { color: var(--color-text-muted); }

    .access-input:focus {
      outline: none;
      border-color: var(--color-brand);
    }

    .access-btn {
      width: 100%;
      margin-top: var(--space-2);
      padding: var(--space-3);
      border: 1px solid var(--color-border-strong);
      border-radius: var(--radius-md);
      background: var(--color-bg-secondary);
      color: var(--color-text-primary);
      font-family: var(--font-sans);
      font-size: var(--font-size-sm);
      font-weight: var(--font-weight-semibold);
      cursor: pointer;
    }

    .access-btn:active { transform: scale(0.99); }

    .access-err {
      margin-top: var(--space-2);
      font-size: var(--font-size-sm);
      color: #dc2626;
      line-height: var(--line-height-relaxed);
    }
  </style>
<link rel="preload" href="/fonts/archivo-var-latin.woff2" as="font" type="font/woff2" crossorigin>
<style>
/* Archivo variable, servida desde nuestro dominio: un archivo de 27 KB contra
   los 413 KB en once archivos que se bajaban de Google. Y sin el <link>
   render-blocking a fonts.googleapis.com, que volvía con `private, max-age=86400`
   y hacía que cada cliente esperara a Google una vez por día para pintar.

   El fallback lleva métricas ajustadas para que el texto no salte cuando la
   fuente termina de cargar: sin esto, `font-display:swap` produce el reflow que
   todo el mundo asocia con "página barata". */
@font-face{
  font-family:"Archivo";
  src:url("/fonts/archivo-var-latin.woff2") format("woff2");
  font-weight:400 800; font-style:normal; font-display:swap;
}
@font-face{
  font-family:"Archivo Fallback";
  src:local("Helvetica Neue"),local("Arial"),local("Roboto");
  size-adjust:96%; ascent-override:92%; descent-override:24%; line-gap-override:0%;
}
</style>
</head>

    <!-- Acceso por link pegado. Es el camino que SIEMPRE funciona: el Universal

  <!-- Acceso por link pegado: acepta el link entero (como llega por WhatsApp,
       con o sin parámetros de más) o el token solo. -->
  <script>
    (function () {
      var TOKEN_KEY = 'mypump_token';
      var TOKEN_RE  = /^[a-zA-Z0-9_-]{16,64}$/;
      var input = document.getElementById('accessInput');
      var btn   = document.getElementById('accessBtn');
      var err   = document.getElementById('accessErr');

      // Dentro de la app nativa, "abrilo desde ahí" no lleva a ningún lado:
      // el link está en WhatsApp y no hay navegador donde abrirlo.
      var esApp = !!(window.Capacitor && window.Capacitor.isNativePlatform &&
                     window.Capacitor.isNativePlatform());
      if (esApp) {
        var body = document.querySelector('.landing-body');
        if (body) body.textContent = 'Pegá abajo el link que te pasó Mati y entrás a tu plan. ¿Todavía no sos cliente? Mirá la demo.';
      }

      function extraer(raw) {
        var v = String(raw || '').trim();
        if (!v) return null;
        try {                                   // link completo: ?t=… o /TOKEN
          var u = new URL(v);
          var t = u.searchParams.get('t');
          if (t && TOKEN_RE.test(t)) return t;
          var last = u.pathname.split('/').filter(Boolean).pop();
          if (last && TOKEN_RE.test(last)) return last;
        } catch (e) {}
        var m = v.match(/[?&]t=([a-zA-Z0-9_-]{16,64})/); // link pegado a medias
        if (m) return m[1];
        return TOKEN_RE.test(v) ? v : null;     // token solo
      }

      function entrar() {
        var tok = extraer(input.value);
        if (!tok) {
          err.textContent = 'No reconocí ese link. Copialo entero de WhatsApp y pegalo de nuevo.';
          err.hidden = false;
          return;
        }
        err.hidden = true;
        try { localStorage.setItem(TOKEN_KEY, tok); } catch (e) {}
        window.location.replace('/cliente.html?t=' + encodeURIComponent(tok));
      }

      btn.addEventListener('click', entrar);
      input.addEventListener('keydown', function (e) { if (e.key === 'Enter') entrar(); });
      input.addEventListener('input', function () { err.hidden = true; });
    })();
  </script>

  <!-- Detección de token + redirección a la app del cliente.
       1. ?t=TOKEN en URL → redirige con token (caso link del coach)
       2. Token previamente guardado en localStorage → redirige sin token
          (caso PWA "Agregar a inicio" en iOS, donde la URL pierde ?t=).
          cliente.html va a recuperar el token desde localStorage. -->
  <script>
    (function () {
      var TOKEN_KEY = 'mypump_token';
      var TOKEN_RE = /^[a-zA-Z0-9_-]{16,64}$/;

      var params = new URLSearchParams(window.location.search);
      var token = params.get('t');
      if (token && TOKEN_RE.test(token)) {
        try { localStorage.setItem(TOKEN_KEY, token); } catch(e) {}
        window.location.replace('/cliente.html?t=' + encodeURIComponent(token));
        return;
      }

      // Sin token en URL, pero hay uno guardado → ir a cliente.html (lee de localStorage)
      try {
        var stored = localStorage.getItem(TOKEN_KEY);
        if (stored && TOKEN_RE.test(stored)) {
          window.location.replace('/cliente.html');
          return;
        }
      } catch(e) {}
    })();
  </script>
