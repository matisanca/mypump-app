# =============================================================
# codemagic.yaml — Build iOS en la nube (sin tocar Xcode ni la terminal)
#
# Compila la app Capacitor, la FIRMA sola y la sube a TestFlight. Corre en las
# Mac de Codemagic (ellos tienen Xcode).
#
# Pasos de una-sola-vez en la UI de Codemagic (ver docs/IOS_CLOUD_BUILD.md):
#   1. Crear cuenta en codemagic.io (gratis) y conectar este repo de GitHub.
#   2. Integrations → App Store Connect → subir una API key (la generás en
#      App Store Connect → Users and Access → Integrations). Nombrala como el
#      valor de `app_store_connect` de abajo: "PumpTeam_ASC".
#   3. Settings → Code signing identities → iOS certificates → "Generate
#      certificate" (tipo Apple Distribution, con la API key de arriba).
#      HECHO el 5-ago-2026: "mypump-dist-2026", vence el 5-ago-2027.
#   4. Crear el provisioning profile en developer.apple.com → Profiles → + →
#      App Store Connect → App ID MyPump → el certificado del paso 3.
#      HECHO: "MyPump App Store", vence el 5-ago-2027.
#   5. Settings → Code signing identities → iOS provisioning profiles →
#      "Fetch profiles" → tildar el del paso 4 → Download selected.
#      HECHO: referencia "mypump-appstore-profile".
#   6. Start build. (El APP_STORE_APPLE_ID ya esta cargado: 6793259380.)
#
# ── Por qué la firma ya no se arma a mano en un script ──
#
# Hasta el 5-ago-2026 este archivo hacía `app-store-connect fetch-signing-files
# --certificate-key "@env:CERTIFICATE_PRIVATE_KEY"`, o sea: la clave privada del
# certificado vivía en una variable de entorno que alguien tenía que generar con
# `openssl genrsa` y pegar a mano. Antes de eso el `openssl genrsa` corría DENTRO
# del build, así que la clave moría con la máquina y el certificado quedaba
# huérfano — nadie podía volver a firmar con él nunca. Se acumularon 3 y Apple
# empezó a rechazar:
#
#   409: You already have a current Distribution certificate
#
# Eso volteó el build #14 el 28-jul-2026, y con él los 24 commits siguientes
# nunca llegaron a compilar (por eso Apple Health "seguía roto" en el teléfono:
# el fix estaba escrito pero nunca se había buildeado).
#
# Ahora el certificado lo genera y lo guarda Codemagic (Settings → Code signing
# identities): la clave privada queda del lado de ellos, no la maneja nadie a
# mano, y no hay variable que se pueda perder. El 5-ago-2026 se revocaron los 3
# certificados huérfanos y se borraron los 3 provisioning profiles que habían
# quedado "Invalid" con "Certificates: 0".
#
# El bloque `ios_signing` de abajo es firma AUTOMÁTICA: en cada build Codemagic
# le pide a Apple el provisioning profile del bundle id, reusando el certificado
# que ya tiene guardado. Que el perfil se rehaga en cada build arregla de paso el
# otro problema histórico: al agregar una capability al App ID (Associated
# Domains, HealthKit, Push) Apple invalida los perfiles existentes, y el script
# viejo REUSABA el inválido en vez de crear uno nuevo — el build moría recién en
# "Compilar IPA" con `"App" requires a provisioning profile with the X feature`.
# Pasó el 27-jul-2026 con Associated Domains.
# =============================================================
workflows:
  ios-testflight:
    name: MyPump iOS → TestFlight
    instance_type: mac_mini_m2
    max_build_duration: 60

    # Disparo por TAG, no por push a main.
    #
    # Hasta acá el build se arrancaba SOLO a mano desde la UI, y cuando el
    # dashboard de Codemagic se degrada (pasó el 27 y el 28 de julio: el
    # diálogo de "Start new build" no abre) no hay forma de compilar. Con esto
    # el disparador es un tag de git, que no depende de que su web ande.
    #
    # Por tag y no por push a main a propósito: no todo commit merece un build
    # de 3 minutos de Mac ni una subida a TestFlight. El tag es la señal
    # explícita de "esto va".
    #
    #   git tag v1.0.2 && git push origin v1.0.2
    triggering:
      events:
        - tag
      tag_patterns:
        - pattern: 'v*'
          include: true

    integrations:
      # Nombre de la API key de App Store Connect que cargás en Codemagic UI.
      app_store_connect: PumpTeam_ASC

    environment:
      node: 22
      xcode: latest
      # Codemagic inicializa el keychain y mete el certificado + el provisioning
      # profile antes de que corra el primer script.
      #
      # OJO: esto resuelve contra las "Code signing identities" GUARDADAS EN
      # CODEMAGIC, no contra la cuenta de Apple. No crea nada. Si el perfil no
      # está guardado ahí, el build muere en 2 segundos, sin log ni máquina, con:
      #
      #   No matching profiles found for bundle identifier "com.pumpteam.mypump"
      #   and distribution type "app_store"
      #
      # y eso NO quiere decir que falte en Apple — quiere decir que falta el
      # "Fetch profiles" del paso 5 de arriba. Pasó en los builds #15 y #16.
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.pumpteam.mypump
      vars:
        BUNDLE_ID: "com.pumpteam.mypump"
        XCODE_PROJECT: "ios/App/App.xcodeproj"
        XCODE_SCHEME: "App"
        # Apple ID numerico de la app (App Store Connect). Ya seteado.
        APP_STORE_APPLE_ID: "6793259380"

    scripts:
      - name: Instalar dependencias (npm)
        script: npm ci
      - name: Capacitor sync iOS
        script: npx cap sync ios
      - name: Sacar el banco de pruebas del binario
        # `cap sync` copia public/ entero, así que el mock de HealthKit y su
        # generador terminan adentro de la app que se manda a Apple. Son
        # inertes ahí (su compuerta exige que NO haya un Capacitor real, y en
        # la app nativa lo hay), pero andamiaje de test dentro de un binario
        # que pasa por App Review es superficie que no hace falta.
        #
        # Va acá y no como un `rm` a mano porque cap sync corre en cada build:
        # borrarlo local no serviría de nada.
        #
        # Comprueba que existan ANTES de borrarlos: `rm -f` sobre algo que no
        # está devuelve 0, así que si alguien renombra el mock este paso se
        # vuelve un no-op y sigue verde mientras el banco viaja en el binario.
        script: |
          set -e
          BASE=ios/App/App/public/js
          for f in health-mock.js salud-sintetica.js; do
            if [ ! -f "$BASE/$f" ]; then
              echo "✗ no encontré $BASE/$f — ¿lo renombraron? Este paso dejó de"
              echo "  sacar el banco de pruebas y nadie se iba a enterar."
              exit 1
            fi
            rm -v "$BASE/$f"
          done
          echo "✓ el banco de pruebas no viaja en el .ipa"
          # El loader en cliente.html queda (son 12 líneas y se auto-desactiva),
          # pero sin estos dos archivos no hay nada que cargar ni por accidente.
      - name: Resolver Swift Packages
        script: |
          xcodebuild -resolvePackageDependencies \
            -project "$XCODE_PROJECT" -scheme "$XCODE_SCHEME"
      - name: Verificar la firma
        # El bloque `ios_signing` del environment ya dejó el certificado en el
        # keychain y el provisioning profile en disco. Esto NO firma nada: solo
        # se planta acá para que, si la firma no quedó, el build muera con un
        # mensaje claro en vez de morir dos pasos después en "Compilar IPA"
        # disfrazado de un error de Xcode.
        script: |
          set -e
          # `use-profiles` es idempotente: si Codemagic ya escribió los ajustes
          # de firma en el proyecto, no cambia nada.
          xcode-project use-profiles

          # Las dos rutas donde puede quedar el perfil según la versión de las
          # CLI tools — mirar solo MobileDevice daba un falso negativo y volteaba
          # el build con la firma ya resuelta.
          # Dos `ls` separados a propósito: con las dos rutas en un mismo `ls`,
          # basta que una no exista para que devuelva error aunque la otra tenga
          # el perfil.
          if ! ls ~/Library/Developer/Xcode/UserData/Provisioning\ Profiles/*.mobileprovision >/dev/null 2>&1 \
             && ! ls ~/Library/MobileDevice/Provisioning\ Profiles/*.mobileprovision >/dev/null 2>&1; then
            echo "✗ No hay ningún provisioning profile."
            echo
            echo "  Codemagic lo trae solo con el bloque ios_signing del environment."
            echo "  Si falta, casi siempre es una de estas dos:"
            echo "   · Settings → Code signing identities → iOS certificates está vacío"
            echo "     (se genera con 'Generate certificate', tipo Apple Distribution)."
            echo "   · La integración App Store Connect 'PumpTeam_ASC' perdió permisos."
            exit 1
          fi

          # Que el certificado esté en el keychain es lo otro que puede faltar, y
          # solo se nota al firmar. security devuelve 1 si no hay ninguna.
          if ! security find-identity -v -p codesigning | grep -q "Apple Distribution"; then
            echo "✗ No hay ninguna identidad 'Apple Distribution' en el keychain."
            exit 1
          fi
          echo "✓ Firma lista (certificado + provisioning profile)"
      - name: Compilar IPA
        script: |
          xcode-project build-ipa \
            --project "$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME"

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true

        # Y ADEMÁS lo manda a revisión de la App Store, sin pasar por la web de
        # App Store Connect.
        #
        # Por qué acá y no a mano: el submit desde ASC necesita una sesión con
        # 2FA que se vence cada pocos días. Cada release quedaba trabado
        # esperando que alguien estuviera con el teléfono a mano. Codemagic ya
        # tiene la API key de App Store Connect cargada como integración, así
        # que puede hacerlo solo — el mismo camino que ya usa para subir a
        # TestFlight, que nunca pidió una sesión.
        #
        # OJO: esto exige que la versión 1.0.6 exista en ASC con su metadata
        # obligatoria (sobre todo "Novedades de esta versión"). Si falta, el
        # paso falla con un error explícito de la API — el build igual quedó
        # subido a TestFlight, así que no se pierde nada y se completa a mano.
        submit_to_app_store: true

        # AFTER_APPROVAL: apenas Apple aprueba, sale. Es lo que corresponde acá:
        # los 62 clientes están esperando el chat, y sostener una versión
        # aprobada sin publicar no le sirve a nadie.
        release_type: AFTER_APPROVAL

        # Cancela un envío anterior que haya quedado colgado en "Waiting for
        # Review". Sin esto, un segundo tag el mismo día choca contra el primero
        # y el build nuevo no entra nunca.
        cancel_previous_submissions: true

        # Descomentá y completá para auto-asignar a un grupo de testers interno:
        # beta_groups:
        #   - "Pump Team interno"

  # =============================================================
  # Android → Google Play
  #
  # Dispara con un tag `a*` (a1.0.5), separado del `v*` de iOS a propósito: las
  # dos tiendas tienen tiempos y rechazos distintos, y no queremos que arreglar
  # algo de Apple obligue a re-subir a Google ni al revés.
  #
  #   git tag a1.0.5 && git push origin a1.0.5
  #
  # PASOS DE UNA SOLA VEZ, antes del primer build:
  #   1. Play Console → cuenta de ORGANIZACIÓN (obligatoria para apps de salud).
  #      D-U-N-S de PUMP TEAM LLC: el mismo que se usó en Apple.
  #      La app tiene que NACER en esa cuenta — migrar una app de una cuenta
  #      personal a una de organización deja la consola pidiendo los 14 días de
  #      testing cerrado y soporte no lo destraba.
  #   2. EL KEYSTORE DE SUBIDA. Es el único paso sin el cual el build ni
  #      arranca: el 18-ago-2026 el build #1 (tag a1.0.6) murió en 4 segundos
  #      con `No keystores with reference 'mypump-upload' were found from code
  #      signing identities` — ni siquiera llegó a `npm ci`.
  #
  #      OJO con la receta vieja de este archivo, que decía "Settings → Code
  #      signing identities → Android keystores → Generate keystore": ESE BOTÓN
  #      NO EXISTE. La pestaña de Android keystores solo ofrece "Upload a
  #      keystore file". Hay que generarlo a mano y subirlo:
  #
  #        keytool -genkeypair -v -keystore mypump-upload.jks \
  #          -alias mypump -keyalg RSA -keysize 2048 -validity 10000
  #
  #      y después Codemagic → Settings (Personal Account) → Code signing
  #      identities → Android keystores → Upload, con:
  #        · reference : mypump-upload   ← tiene que decir exactamente esto,
  #                                        es lo que busca `android_signing`
  #        · alias     : mypump
  #        · las dos passwords que pidió keytool
  #
  #      Con Play App Signing esta es solo la clave de SUBIDA: la de firma real
  #      la guarda Google. Si se pierde, se pide un reseteo de la de subida y no
  #      se muere nadie — pero guardá igual el .jks y las passwords.
  #
  #   3. La publicación automática a Play (bloque `publishing` de abajo) está
  #      COMENTADA a propósito hasta el primer release. Dos motivos:
  #        · el primer release de producción hay que crearlo a mano en la
  #          consola igual (Play no acepta que un AAB inaugure una app por API);
  #        · necesita una cuenta de servicio de Google Cloud con su JSON
  #          (Play Console → Configuración → Acceso a la API), que al 18-ago-2026
  #          no existe. Con `credentials:` apuntando a una variable vacía, el
  #          build compila los 4 minutos completos y recién revienta al final.
  #      Mientras esté comentado, el AAB sale igual como ARTEFACTO y se sube a
  #      mano desde Play Console → Producción → Crear nueva versión.
  #      Para automatizarlo después: crear la cuenta de servicio, cargar el JSON
  #      completo en una línea como variable GCLOUD_SERVICE_ACCOUNT_CREDENTIALS
  #      del grupo `google-play` marcada SECURE, y descomentar los dos bloques.
  #   4. Con el primer AAB subido: Play Console → Integridad de la app → copiar
  #      el SHA-256 de "Certificado de firma de la app" y pegarlo en
  #      public/.well-known/assetlinks.json. Sin eso los links del coach abren
  #      el navegador en vez de la app, sin avisar.
  #   5. Play Console → Contenido de la app → "Health apps declaration":
  #      justificar los 17 permisos de lectura. El manifest ya está recortado
  #      para que sean exactamente los que la app usa.
  # =============================================================
  android-play:
    name: MyPump Android → Google Play
    instance_type: mac_mini_m2
    max_build_duration: 45

    triggering:
      events:
        - tag
      tag_patterns:
        - pattern: 'a*'
          include: true

    environment:
      node: 22
      java: 21
      android_signing:
        - mypump-upload
      # groups:
      #   - google-play   ← solo hace falta con el `publishing` de abajo activo
      vars:
        PACKAGE_NAME: "com.pumpteam.mypump"

    scripts:
      - name: Instalar dependencias (npm)
        script: npm ci

      - name: Chequeos que no necesitan compilar
        # Corren ANTES del build para que una desincronización entre el bridge
        # y el manifest se vea en 10 segundos y no después de 4 minutos de
        # Gradle. check-android-permisos es el que evita el SecurityException
        # que solo aparecería en el teléfono del cliente.
        script: |
          set -e
          node scripts/check-android-permisos.mjs
          node scripts/check-healthkit-tipos.mjs
          node scripts/test-bridge-android.mjs

      - name: Marcar si el binario lleva Firebase
        # `cap sync` copia public/ ENTERO adentro del APK, así que este archivo
        # tiene que quedar escrito ANTES. El flag decide si la app se anima a
        # llamar a PushNotifications.register() en Android: sin Firebase, esa
        # llamada mata el proceso desde el lado nativo y ningún try/catch de JS
        # lo atrapa.
        #
        # Que lo decida el build y no una persona es el punto: así el día que
        # aparezca google-services.json el push se prende solo, y si el archivo
        # se pierde, se apaga solo. Nadie tiene que acordarse.
        script: |
          set -e
          if [ -f android/app/google-services.json ]; then
            echo 'window.MYPUMP_FCM = true;' > public/js/fcm-flag.js
            echo "✓ google-services.json presente → push nativo de Android PRENDIDO"
          else
            echo 'window.MYPUMP_FCM = false;' > public/js/fcm-flag.js
            echo "· sin google-services.json → push nativo de Android apagado (Web Push sigue andando)"
          fi

      - name: Capacitor sync Android
        script: npx cap sync android

      - name: Sacar el banco de pruebas del binario
        # Mismo motivo que en iOS: `cap sync` copia public/ entero, así que el
        # mock de salud y su generador terminarían adentro del AAB que se sube
        # a Play. Son inertes (su compuerta exige que NO haya Capacitor real y
        # que el host sea localhost), pero es superficie que no hace falta en
        # una app que además pasa por la Health apps declaration.
        #
        # Va con `set -e` y comprobando que los archivos EXISTAN antes de
        # borrarlos. `rm -f` sobre algo que no está devuelve 0: si mañana
        # alguien renombra el mock, este paso se vuelve un no-op y sigue verde
        # mientras el banco de pruebas viaja adentro del AAB. Es la falla muda
        # de siempre — el paso corre, no falla, y no hace nada.
        script: |
          set -e
          BASE=android/app/src/main/assets/public/js
          for f in health-mock.js salud-sintetica.js; do
            if [ ! -f "$BASE/$f" ]; then
              echo "✗ no encontré $BASE/$f — ¿lo renombraron? Este paso dejó de"
              echo "  sacar el banco de pruebas y nadie se iba a enterar."
              exit 1
            fi
            rm -v "$BASE/$f"
          done
          echo "✓ el banco de pruebas no viaja en el AAB"

      - name: Compilar AAB
        # AAB y no APK: Play lo exige para apps nuevas desde agosto de 2021.
        # El APK se sigue generando aparte para poder probar por sideload sin
        # pasar por Play (ver docs/ANDROID.md).
        script: |
          set -e
          cd android
          ./gradlew bundleRelease
          ./gradlew assembleRelease

      - name: Verificar que no se coló un permiso de escritura
        # El manifest FUENTE está recortado, pero el que importa es el MERGEADO
        # — el que queda adentro del AAB después de sumar los de las librerías.
        # Si el merger ignorara un tools:node="remove", acá se ve; en el
        # manifest fuente, no.
        script: |
          set -e
          MERGED=$(find android/app/build -name "AndroidManifest.xml" -path "*release*" | head -1)
          if [ -z "$MERGED" ]; then
            echo "✗ no encontré el manifest mergeado"; exit 1
          fi
          echo "→ $MERGED"
          if grep -q "permission.health.WRITE_" "$MERGED"; then
            echo "✗ el APK pide permisos de ESCRITURA de salud. MyPump solo lee."
            grep -o "permission.health.WRITE_[A-Z_]*" "$MERGED" | sort -u
            exit 1
          fi
          # Y que el MERGE no reintrodujo un permiso de LECTURA que sacamos.
          # El 28-ago se sacó READ_OXYGEN_SATURATION del manifest fuente (Google
          # había rechazado la app por él) y el AAB lo siguió trayendo: lo
          # declara el plugin de Health Connect por su cuenta, así que borrar
          # nuestra línea no alcanza, hace falta tools:node="remove".
          # check-android-permisos.mjs no lo vio porque compara contra el
          # manifest FUENTE; esto compara contra el que va adentro del binario,
          # que es el único que Google mira.
          PROHIBIDOS="READ_OXYGEN_SATURATION"
          for P in $PROHIBIDOS; do
            if grep -q "permission.health.$P" "$MERGED"; then
              echo "✗ $P sobrevivió al merge y Google ya rechazó la app por él."
              echo "  Poné <uses-permission ... tools:node=\"remove\" /> en el manifest."
              exit 1
            fi
          done
          echo "✓ ningún permiso de la lista negra sobrevivió al merge"
          echo "✓ solo lectura: $(grep -o 'permission.health.READ_[A-Z_]*' "$MERGED" | sort -u | wc -l | tr -d ' ') permisos"

    artifacts:
      - android/app/build/outputs/**/*.aab
      - android/app/build/outputs/**/*.apk
      - android/app/build/outputs/**/mapping.txt

    # Ver el punto 3 de la cabecera: hasta que exista la cuenta de servicio de
    # Google Cloud, publicar por API es imposible y dejar esto activo solo logra
    # que el build compile entero y muera al final. El AAB queda como artefacto
    # y se sube a mano. Para reactivar: cargar GCLOUD_SERVICE_ACCOUNT_CREDENTIALS
    # y descomentar esto Y el `groups:` de arriba.
    #
    # publishing:
    #   google_play:
    #     credentials: $GCLOUD_SERVICE_ACCOUNT_CREDENTIALS
    #     # internal: llega a los testers internos en minutos, sin revisión.
    #     # Cuando esté probado se promueve a producción desde la consola.
    #     track: internal
    #     submit_as_draft: true
