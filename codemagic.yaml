# =============================================================
# codemagic.yaml — Build iOS en la nube (sin tocar Xcode ni la terminal)
#
# Compila la app Capacitor, la FIRMA sola (App Store Connect API key →
# "automatic code signing" de Codemagic, sin certificados a mano) y la sube a
# TestFlight. Corre en las Mac de Codemagic (ellos tienen Xcode).
#
# SOLO corre cuando Apple ya aceptó tu cuenta Developer. Pasos de una-sola-vez
# en la UI de Codemagic (ver docs/IOS_CLOUD_BUILD.md):
#   1. Crear cuenta en codemagic.io (gratis) y conectar este repo de GitHub.
#   2. Integrations → App Store Connect → subir una API key (la generás en
#      App Store Connect → Users and Access → Integrations). Nombrala como el
#      valor de `app_store_connect` de abajo: "PumpTeam_ASC".
#   3. Environment variables → CERTIFICATE_PRIVATE_KEY (marcada "Secure"), con
#      el contenido de una clave RSA que generes vos:
#          openssl genrsa -out firma.key 2048
#      Guardá firma.key en tu gestor de contraseñas. ES LA MISMA PARA SIEMPRE:
#      el certificado de distribución de Apple no sirve sin ella, y si la
#      perdés hay que revocar y empezar de nuevo. El paso de firma corta el
#      build con instrucciones si falta.
#   4. Start build. (El APP_STORE_APPLE_ID ya esta cargado: 6793259380.)
# =============================================================
workflows:
  ios-testflight:
    name: MyPump iOS → TestFlight
    instance_type: mac_mini_m2
    max_build_duration: 60

    # Disparo por TAG, no por push a main.
    #
    # Hasta acá el build se arrancaba SOLO a mano desde la UI, y cuando el
    # dashboard de Codemagic se degrada (pasó el 27 y el 28 de julio: el
    # diálogo de "Start new build" no abre) no hay forma de compilar. Con esto
    # el disparador es un tag de git, que no depende de que su web ande.
    #
    # Por tag y no por push a main a propósito: no todo commit merece un build
    # de 3 minutos de Mac ni una subida a TestFlight. El tag es la señal
    # explícita de "esto va".
    #
    #   git tag v1.0.2 && git push origin v1.0.2
    triggering:
      events:
        - tag
      tag_patterns:
        - pattern: 'v*'
          include: true

    integrations:
      # Nombre de la API key de App Store Connect que cargás en Codemagic UI.
      app_store_connect: PumpTeam_ASC

    environment:
      node: 22
      xcode: latest
      vars:
        BUNDLE_ID: "com.pumpteam.mypump"
        XCODE_PROJECT: "ios/App/App.xcodeproj"
        XCODE_SCHEME: "App"
        # Apple ID numerico de la app (App Store Connect). Ya seteado.
        APP_STORE_APPLE_ID: "6793259380"

    scripts:
      - name: Instalar dependencias (npm)
        script: npm ci
      - name: Capacitor sync iOS
        script: npx cap sync ios
      - name: Resolver Swift Packages
        script: |
          xcodebuild -resolvePackageDependencies \
            -project "$XCODE_PROJECT" -scheme "$XCODE_SCHEME"
      - name: Configurar firma (crea certificado + perfil)
        # OJO al agregar una capability nueva al App ID (Associated Domains,
        # Push, etc.): Apple invalida los provisioning profiles existentes, pero
        # `fetch-signing-files --create` REUSA el que ya existe en lugar de crear
        # uno nuevo, así que el build muere recién en "Compilar IPA" con
        #   error: "App" requires a provisioning profile with the X feature
        # Fix (una sola vez, después de tocar el App ID): borrar los perfiles en
        # developer.apple.com → Certificates, IDs & Profiles → Profiles (van a
        # figurar como "Invalid") y relanzar el build: acá se regeneran solos ya
        # con la capability nueva. Pasó el 27-jul-2026 con Associated Domains.
        script: |
          set -e
          keychain initialize

          # ── La clave privada tiene que SOBREVIVIR entre builds ──
          #
          # Un certificado de distribución de Apple no vale nada sin la clave
          # privada con la que se pidió. Antes acá se hacía `openssl genrsa` en
          # cada build: la clave moría con la máquina, el certificado quedaba
          # huérfano (nadie puede volver a firmar con él nunca) y al siguiente
          # build había que pedir otro. Apple permite pocos y al llenarse
          # responde:
          #
          #   409: You already have a current Distribution certificate
          #
          # Pasó el 28-jul-2026 en el build #14, con 3 certificados huérfanos ya
          # acumulados. Cada build gastaba un cupo que nunca iba a usar.
          #
          # Con CERTIFICATE_PRIVATE_KEY seteada, `fetch-signing-files` encuentra
          # el certificado que YA existe para esa clave y lo reusa: no crea
          # nada, no gasta cupo, y el problema no vuelve.
          #
          # POR QUÉ NO SE REVOCAN SOLOS: acá había un paso que borraba todos los
          # certificados de distribución de la cuenta antes de pedir el suyo.
          # Nunca funcionó (reportaba "total: 0" porque se tragaba sus propios
          # errores), y menos mal: arreglarlo habría hecho que cada build borre
          # certificados de la cuenta de Apple sin preguntar, incluido el que se
          # use en Xcode. Es irreversible y no es algo que deba pasar solo.
          if [ -z "${CERTIFICATE_PRIVATE_KEY:-}" ]; then
            echo "✗ Falta la variable CERTIFICATE_PRIVATE_KEY."
            echo
            echo "  Sin ella cada build pide un certificado nuevo a Apple, y Apple"
            echo "  ya los rechaza (409: You already have a current Distribution"
            echo "  certificate). Es de una sola vez:"
            echo
            echo "  1. developer.apple.com → Certificates, IDs & Profiles → Certificates."
            echo "     Revisá los de tipo Distribution. Los que no uses en ninguna Mac"
            echo "     son huérfanos de builds viejos: revocalos (dejá como mucho uno)."
            echo "  2. Generá una clave: openssl genrsa -out firma.key 2048"
            echo "  3. Codemagic → app settings → Environment variables:"
            echo "     nombre CERTIFICATE_PRIVATE_KEY, valor = el contenido de firma.key,"
            echo "     marcá 'Secure'. Guardá firma.key en tu gestor de contraseñas:"
            echo "     si se pierde, el certificado que genere queda inservible."
            echo "  4. Relanzá el build. De acá en más reusa siempre el mismo."
            exit 1
          fi

          # --create crea el certificado y el provisioning profile SOLO si no
          # existen para esta clave; si ya existen, los reusa. El perfil sale con
          # las capabilities que tenga el App ID (HealthKit + Associated Domains).
          echo "→ Usando la clave persistida (reusa el certificado si ya existe)"
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --certificate-key "@env:CERTIFICATE_PRIVATE_KEY" \
            --create
          keychain add-certificates
          xcode-project use-profiles

          # Falla ruidosa: sin esto, un perfil ausente pasa desapercibido acá y
          # el error aparece dos pasos después disfrazado de otra cosa.
          # Las dos rutas donde puede quedar el perfil según la versión de las
          # CLI tools — mirar solo MobileDevice daba un falso negativo y volteaba
          # el build con la firma ya resuelta.
          # Dos `ls` separados a propósito: con las dos rutas en un mismo `ls`,
          # basta que una no exista para que devuelva error aunque la otra tenga
          # el perfil.
          if ! ls ~/Library/Developer/Xcode/UserData/Provisioning\ Profiles/*.mobileprovision >/dev/null 2>&1 \
             && ! ls ~/Library/MobileDevice/Provisioning\ Profiles/*.mobileprovision >/dev/null 2>&1; then
            echo "✗ No se creó ningún provisioning profile — revisá el log de arriba"
            exit 1
          fi
          echo "✓ Firma lista (certificado + provisioning profile)"
      - name: Compilar IPA
        script: |
          xcode-project build-ipa \
            --project "$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME"

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      app_store_connect:
        auth: integration
        # Sube el build a TestFlight (no lo manda a review de la App Store).
        submit_to_testflight: true
        # Descomentá y completá para auto-asignar a un grupo de testers interno:
        # beta_groups:
        #   - "Pump Team interno"
