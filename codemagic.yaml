# =============================================================
# codemagic.yaml — Build iOS en la nube (sin tocar Xcode ni la terminal)
#
# Compila la app Capacitor, la FIRMA sola (App Store Connect API key →
# "automatic code signing" de Codemagic, sin certificados a mano) y la sube a
# TestFlight. Corre en las Mac de Codemagic (ellos tienen Xcode).
#
# SOLO corre cuando Apple ya aceptó tu cuenta Developer. Pasos de una-sola-vez
# en la UI de Codemagic (ver docs/IOS_CLOUD_BUILD.md):
#   1. Crear cuenta en codemagic.io (gratis) y conectar este repo de GitHub.
#   2. Integrations → App Store Connect → subir una API key (la generás en
#      App Store Connect → Users and Access → Integrations). Nombrala como el
#      valor de `app_store_connect` de abajo: "PumpTeam_ASC".
#   3. Start build. (El APP_STORE_APPLE_ID ya esta cargado: 6793259380.)
# =============================================================
workflows:
  ios-testflight:
    name: MyPump iOS → TestFlight
    instance_type: mac_mini_m2
    max_build_duration: 60

    # Disparo por TAG, no por push a main.
    #
    # Hasta acá el build se arrancaba SOLO a mano desde la UI, y cuando el
    # dashboard de Codemagic se degrada (pasó el 27 y el 28 de julio: el
    # diálogo de "Start new build" no abre) no hay forma de compilar. Con esto
    # el disparador es un tag de git, que no depende de que su web ande.
    #
    # Por tag y no por push a main a propósito: no todo commit merece un build
    # de 3 minutos de Mac ni una subida a TestFlight. El tag es la señal
    # explícita de "esto va".
    #
    #   git tag v1.0.2 && git push origin v1.0.2
    triggering:
      events:
        - tag
      tag_patterns:
        - pattern: 'v*'
          include: true

    integrations:
      # Nombre de la API key de App Store Connect que cargás en Codemagic UI.
      app_store_connect: PumpTeam_ASC

    environment:
      node: 22
      xcode: latest
      vars:
        BUNDLE_ID: "com.pumpteam.mypump"
        XCODE_PROJECT: "ios/App/App.xcodeproj"
        XCODE_SCHEME: "App"
        # Apple ID numerico de la app (App Store Connect). Ya seteado.
        APP_STORE_APPLE_ID: "6793259380"

    scripts:
      - name: Instalar dependencias (npm)
        script: npm ci
      - name: Capacitor sync iOS
        script: npx cap sync ios
      - name: Resolver Swift Packages
        script: |
          xcodebuild -resolvePackageDependencies \
            -project "$XCODE_PROJECT" -scheme "$XCODE_SCHEME"
      - name: Configurar firma (crea certificado + perfil)
        # OJO al agregar una capability nueva al App ID (Associated Domains,
        # Push, etc.): Apple invalida los provisioning profiles existentes, pero
        # `fetch-signing-files --create` REUSA el que ya existe en lugar de crear
        # uno nuevo, así que el build muere recién en "Compilar IPA" con
        #   error: "App" requires a provisioning profile with the X feature
        # Fix (una sola vez, después de tocar el App ID): borrar los perfiles en
        # developer.apple.com → Certificates, IDs & Profiles → Profiles (van a
        # figurar como "Invalid") y relanzar el build: acá se regeneran solos ya
        # con la capability nueva. Pasó el 27-jul-2026 con Associated Domains.
        script: |
          set -e
          keychain initialize

          # La clave privada se genera acá y muere con la máquina de build, así
          # que los certificados de distribución que quedan en la cuenta de Apple
          # son huérfanos: nadie puede firmar con ellos nunca más. Apple permite
          # como máximo 3, y al cuarto responde
          #   409: You already have a current Distribution certificate
          # sin cortar el build — se queda sin certificado Y sin perfil, y recién
          # revienta en "Compilar IPA" con un mensaje que apunta a otro lado
          # ("requires a provisioning profile with the X feature"). Pasó el
          # 27-jul-2026. Por eso los revocamos antes de pedir el nuestro.
          echo "→ Revocando certificados de distribución huérfanos…"
          python3 - <<'PY' || true
          import json, subprocess
          # Los dos tipos con los que Apple etiqueta un cert de distribución;
          # filtrar solo uno dejaría la mitad viva y el cupo igual de lleno.
          vistos = set()
          for tipo in ('IOS_DISTRIBUTION', 'DISTRIBUTION'):
              p = subprocess.run(['app-store-connect', 'list-certificates',
                                  '--type', tipo, '--json'],
                                 capture_output=True, text=True, stdin=subprocess.DEVNULL)
              if p.returncode != 0:
                  continue
              try:
                  certs = json.loads(p.stdout or '[]')
              except Exception:
                  continue
              for c in certs if isinstance(certs, list) else []:
                  cid = c.get('id')
                  if not cid or cid in vistos:
                      continue
                  vistos.add(cid)
                  # stdin cerrado: si algún día pide confirmación, falla en vez
                  # de colgar el build hasta el timeout.
                  r = subprocess.run(['app-store-connect', 'delete-certificate', cid],
                                     capture_output=True, text=True, stdin=subprocess.DEVNULL)
                  print(f"  {cid}: {'revocado' if r.returncode == 0 else 'no se pudo (sigo igual)'}")
          print(f"  total: {len(vistos)}")
          PY

          # --create genera el certificado de distribución Y el provisioning
          # profile del bundle en una sola pasada. El perfil sale con las
          # capabilities que tenga el App ID (HealthKit + Associated Domains).
          CERT_KEY=$(mktemp /tmp/cert_key.XXXXXX)
          openssl genrsa -out "$CERT_KEY" 2048
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --certificate-key @file:"$CERT_KEY" \
            --create
          keychain add-certificates
          xcode-project use-profiles

          # Falla ruidosa: sin esto, un perfil ausente pasa desapercibido acá y
          # el error aparece dos pasos después disfrazado de otra cosa.
          # Las dos rutas donde puede quedar el perfil según la versión de las
          # CLI tools — mirar solo MobileDevice daba un falso negativo y volteaba
          # el build con la firma ya resuelta.
          # Dos `ls` separados a propósito: con las dos rutas en un mismo `ls`,
          # basta que una no exista para que devuelva error aunque la otra tenga
          # el perfil.
          if ! ls ~/Library/Developer/Xcode/UserData/Provisioning\ Profiles/*.mobileprovision >/dev/null 2>&1 \
             && ! ls ~/Library/MobileDevice/Provisioning\ Profiles/*.mobileprovision >/dev/null 2>&1; then
            echo "✗ No se creó ningún provisioning profile — revisá el log de arriba"
            exit 1
          fi
          echo "✓ Firma lista (certificado + provisioning profile)"
      - name: Compilar IPA
        script: |
          xcode-project build-ipa \
            --project "$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME"

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      app_store_connect:
        auth: integration
        # Sube el build a TestFlight (no lo manda a review de la App Store).
        submit_to_testflight: true
        # Descomentá y completá para auto-asignar a un grupo de testers interno:
        # beta_groups:
        #   - "Pump Team interno"
