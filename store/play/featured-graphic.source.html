<!doctype html><meta charset=utf-8><style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1024px;height:500px;overflow:hidden;background:#0a0a0a}
.fg{position:relative;width:1024px;height:500px;background:#0a0a0a;
    display:flex;align-items:center;justify-content:center;gap:52px;
    font-family:-apple-system,'SF Pro Display','Helvetica Neue',sans-serif;
    -webkit-font-smoothing:antialiased}
/* resplandor verde de la marca: da profundidad sin robar contraste al texto */
.fg::before{content:'';position:absolute;inset:0;
  background:radial-gradient(58% 88% at 16% 108%, rgba(29,147,48,.34) 0%, rgba(29,147,48,0) 62%),
             radial-gradient(46% 72% at 92% -12%, rgba(29,147,48,.16) 0%, rgba(29,147,48,0) 60%)}
/* franja inferior con el verde del logo */
.fg::after{content:'';position:absolute;left:0;right:0;bottom:0;height:6px;
  background:linear-gradient(90deg,#1D9330 0%,#2fbf47 100%)}
.mark{position:relative;width:180px;height:180px;border-radius:42px;overflow:hidden;
  flex:0 0 auto;box-shadow:0 24px 60px rgba(29,147,48,.36)}
.mark img{width:100%;height:100%;display:block}
.txt{position:relative}
.wm{font-size:96px;font-weight:700;letter-spacing:-.035em;color:#fff;line-height:1}
.tag{margin-top:20px;font-size:31px;font-weight:400;letter-spacing:-.012em;
  color:#c9c9c9;line-height:1.28}
.by{margin-top:26px;display:flex;align-items:center;gap:13px}
.by i{display:block;width:34px;height:2px;background:#2fbf47}
.by span{font-size:17px;font-weight:600;letter-spacing:.24em;color:#2fbf47}
</style>
