ext {
    // 26 y no el 24 que pone Capacitor por defecto: @capgo/capacitor-health
    // declara minSdk 26 en su build.gradle, y el manifest merger falla el build
    // entero si la app pide menos que una de sus librerías. Android 8.0 es de
    // 2017; Health Connect ni siquiera existe por debajo de Android 9.
    minSdkVersion = 26
    compileSdkVersion = 36
    targetSdkVersion = 36
    androidxActivityVersion = '1.11.0'
    androidxAppCompatVersion = '1.7.1'
    androidxCoordinatorLayoutVersion = '1.3.0'
    androidxCoreVersion = '1.17.0'
    androidxFragmentVersion = '1.8.9'
    coreSplashScreenVersion = '1.2.0'
    androidxWebkitVersion = '1.14.0'
    junitVersion = '4.13.2'
    androidxJunitVersion = '1.3.0'
    androidxEspressoCoreVersion = '3.7.0'
    cordovaAndroidVersion = '14.0.1'
}