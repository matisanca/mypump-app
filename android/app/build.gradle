apply plugin: 'com.android.application'

android {
    namespace = "com.pumpteam.mypump"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.pumpteam.mypump"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        // Alineados con iOS a propósito: un solo número de versión para las dos
        // tiendas evita el clásico "¿qué build tenía el cliente?" cuando
        // reporta algo. Ver ios/App/App.xcodeproj (MARKETING_VERSION /
        // CURRENT_PROJECT_VERSION).
        // 11 / 1.0.7: Play rechazó el 10 el 26-ago por pedir
        // READ_OXYGEN_SATURATION sin una función que lo use. El permiso salió
        // del manifest y del bridge (ahí quedó soloIOS). Un versionCode que ya
        // fue rechazado no se puede reusar, y la versión visible sube porque el
        // binario de Android CAMBIÓ: iOS 1.0.6 sí lee saturación y este no.
        // iOS debería ir a 1.0.7 en su próximo build para volver a alinearlas.
        versionCode 12
        versionName "1.0.7"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    // Codemagic, con `android_signing: [mypump-upload]`, deja el keystore en disco
    // y exporta estas cuatro variables. Lo que NO hace es tocar build.gradle: eso
    // lo hace solo en proyectos Flutter, donde además escribe android/key.properties
    // y el template de Flutter ya lo lee. En un proyecto Android puro hay que
    // cablearlo a mano, y si no está, Gradle NO se queja: compila y produce un AAB
    // sin firmar. El build queda verde y recién revienta al publicar en Play.
    signingConfigs {
        release {
            def ks = System.getenv("CM_KEYSTORE_PATH")
            if (ks) {
                storeFile     file(ks)
                storePassword System.getenv("CM_KEYSTORE_PASSWORD")
                keyAlias      System.getenv("CM_KEY_ALIAS")
                keyPassword   System.getenv("CM_KEY_PASSWORD")
            }
        }
    }

    buildTypes {
        release {
            // Solo se engancha si el keystore existe. Sin esta guarda, un
            // assembleRelease local (sin las variables) falla con un error de
            // Gradle sobre storeFile null en vez de dar el APK sin firmar de
            // siempre.
            if (System.getenv("CM_KEYSTORE_PATH")) {
                signingConfig signingConfigs.release
            }
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
